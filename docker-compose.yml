---
networks:
  app_network:
    driver: bridge

volumes:
  ssh_keys:

x-target-host-common: &target_host_common
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /tmp
  networks:
    - app_network
  volumes:
    - ssh_keys:/root/.ssh
  depends_on:
    ansible_host:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 22 && [ -f /root/.ssh/authorized_keys ]"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 5s

x-target-host-redhat: &target_host_redhat
  <<: *target_host_common
  build:
    context: ./docker
    dockerfile: target-host-redhat/Dockerfile

x-target-host-ubuntu: &target_host_ubuntu
  <<: *target_host_common
  build:
    context: ./docker
    dockerfile: target-host-ubuntu/Dockerfile

services:
  ansible_host:
    build: ./docker/ansible-controller
    container_name: ansible_host
    networks:
      - app_network
    volumes:
      - ./inventory:/workspace/inventory
      - ./scenarios:/workspace/scenarios
      - ssh_keys:/root/.ssh
      - ./docker/ansible-controller/entrypoint.sh:/entrypoint.sh:ro
    command: sh /entrypoint.sh
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=False
    healthcheck:
      test: ["CMD-SHELL", "[ -f /root/.ssh/id_rsa.pub ]"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s

  target_host1:
    <<: *target_host_redhat
    container_name: target_host1

  target_host2:
    <<: *target_host_redhat
    container_name: target_host2

  target_host3:
    <<: *target_host_redhat
    container_name: target_host3

  target_host4:
    <<: *target_host_redhat
    container_name: target_host4

  target_host5:
    <<: *target_host_ubuntu
    container_name: target_host5

  target_host6:
    <<: *target_host_ubuntu
    container_name: target_host6
