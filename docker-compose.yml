---
networks:
  app_network:
    name: ansible-lab-network
    driver: bridge

volumes:
  ssh_keys:

x-target-host-common: &target_host_common
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /tmp
  networks:
    - app_network
  volumes:
    - ssh_keys:/root/.ssh
  depends_on:
    ansible_host:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 22 && [ -f /root/.ssh/authorized_keys ]"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 5s

x-target-host-redhat: &target_host_redhat
  <<: *target_host_common
  build:
    context: ./docker
    dockerfile: target-host-redhat/Dockerfile

x-target-host-ubuntu: &target_host_ubuntu
  <<: *target_host_common
  build:
    context: ./docker
    dockerfile: target-host-ubuntu/Dockerfile

services:
  ansible_host:
    build: ./docker/ansible-controller
    container_name: ansible_host
    networks:
      - app_network
    volumes:
      - ./inventory:/workspace/inventory
      - ./playbooks:/workspace/playbooks
      - ./roles:/workspace/roles
      - ./ansible.cfg:/workspace/ansible.cfg:ro
      - ssh_keys:/root/.ssh
      - ./docker/ansible-controller/entrypoint.sh:/entrypoint.sh:ro
    command: sh /entrypoint.sh
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=False
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: ["CMD-SHELL", "[ -f /root/.ssh/id_ed25519.pub ]"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s

  target_host1:
    <<: *target_host_redhat
    container_name: target_host1

  target_host2:
    <<: *target_host_redhat
    container_name: target_host2

  target_host3:
    <<: *target_host_redhat
    container_name: target_host3

  target_host4:
    <<: *target_host_redhat
    container_name: target_host4

  target_host5:
    <<: *target_host_ubuntu
    container_name: target_host5

  target_host6:
    <<: *target_host_ubuntu
    container_name: target_host6

  localstack:
    image: localstack/localstack:3
    container_name: localstack
    networks:
      - app_network
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,secretsmanager
      - DEBUG=0
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
