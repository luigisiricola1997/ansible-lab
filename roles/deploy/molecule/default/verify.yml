---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read deployed config
      ansible.builtin.slurp:
        src: /opt/app/config.txt
      register: deploy_cfg

    - name: Confirm config content matches the deploy role version
      ansible.builtin.assert:
        that:
          - (deploy_cfg.content | b64decode | trim) == "version=2.0"
        fail_msg: "Config content is unexpected: {{ deploy_cfg.content | b64decode }}"
