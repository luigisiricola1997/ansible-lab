---
- name: Ensure app directory exists
  ansible.builtin.file:
    path: /opt/app
    state: directory
    mode: '0755'

- name: Deploy new config (with rollback on failure)
  block:
    - name: Write new config (Ansible auto-backups previous version on change)
      ansible.builtin.copy:
        content: "version=2.0\n"
        dest: /opt/app/config.txt
        mode: '0644'
        backup: true
      register: deploy_write

    - name: Validate new config
      ansible.builtin.fail:
        msg: "Validation failed (simulated on {{ inventory_hostname }})"
      when: simulate_failure | default(false) | bool

  rescue:
    - name: Restore previous config from automatic backup
      ansible.builtin.copy:
        src: "{{ deploy_write.backup_file }}"
        dest: /opt/app/config.txt
        remote_src: true
        mode: '0644'
      when:
        - deploy_write.backup_file is defined
        - deploy_write.backup_file | length > 0

    - name: Remove new config (no previous version to restore)
      ansible.builtin.file:
        path: /opt/app/config.txt
        state: absent
      when:
        - deploy_write.backup_file is not defined or
          deploy_write.backup_file | length == 0

    - name: Notify rollback
      ansible.builtin.debug:
        msg: "Rollback applied on {{ inventory_hostname }}"
