---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Refresh apt cache on Debian family
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: nginx_prepare_apt
      retries: 5
      delay: 6
      until: nginx_prepare_apt is succeeded
      when: ansible_facts['os_family'] == 'Debian'
