name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ansible/ansible-lint@v25.1.3
        with:
          requirements_file: requirements.yml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Check terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

  molecule:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [nginx, deploy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Molecule with Docker driver
        run: pip install "molecule-plugins[docker]" ansible

      - name: Run Molecule for ${{ matrix.role }}
        working-directory: roles/${{ matrix.role }}
        run: molecule test

  integration:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [test-ansible, test-cloud]
    steps:
      - uses: actions/checkout@v4

      - name: Start lab
        run: make up

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

      - name: Show logs on failure
        if: failure()
        run: make logs

      - name: Cleanup
        if: always()
        run: make down
