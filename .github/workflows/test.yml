name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ansible/ansible-lint@v25.1.3

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start lab
        run: make up

      - name: Run all scenarios
        run: make test

      - name: Show logs on failure
        if: failure()
        run: make logs

      - name: Cleanup
        if: always()
        run: make down
